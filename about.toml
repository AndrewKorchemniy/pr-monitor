# about.toml — duplicated allowlist (cargo-about can't read deny.toml); Windows targets only (shipped bits)
accepted = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "BSL-1.0", "CC0-1.0", "0BSD", "Unicode-3.0", "Unicode-DFS-2016",
  "CDLA-Permissive-2.0", "MPL-2.0", "OFL-1.1", "Ubuntu-font-1.0", "Unlicense",
]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = []   # ring 0.17.14 is in the Windows graph (velopack -> ureq -> rustls); its "Apache-2.0 AND ISC" needs no "ring" workaround (same output with it). Add "ring" if an older ring with an OpenSSL term appears
