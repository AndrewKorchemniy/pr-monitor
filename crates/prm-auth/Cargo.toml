[package]
name = "prm-auth"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-support = ["prm-domain/test-support", "prm-ado/test-support"]

[dependencies]
prm-domain = { workspace = true }
prm-ado = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "net", "io-util", "macros"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
which = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
prm-domain = { workspace = true, features = ["test-support"] }
prm-ado = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
insta = { workspace = true }

[lints]
workspace = true
