[files]
extend-exclude = [
  "CHANGELOG.md", "Cargo.lock", "LICENSE-*", "*.svg", "vendor/**",
  "crates/*/assets/**", "crates/*/tests/fixtures/**", "**/snapshots/**",
]

[default]
extend-ignore-re = ["(?Rm)^.*(#|//)\\s*spellchecker:disable-line$"]

[default.extend-words]
