name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  semantic:
    name: Validate PR title        # required-check context
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          subjectPattern: ^(?![A-Z]).+$|^Bump .+$        # Dependabot titles start with "Bump"
          subjectPatternError: "The subject must start lowercase (Conventional Commits)."
