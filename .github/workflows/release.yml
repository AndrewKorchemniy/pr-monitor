name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          dry-run: build, verify and upload dist/ as an artifact (no release touched).
          release-current (main only): draft v<crates/pr-monitor version> at this commit, build, attest, upload, then go-live.
          recover: rebuild an existing DRAFT release named by `tag`.
        type: choice
        options: [dry-run, release-current, recover]
        default: dry-run
      tag:
        description: "recover only: tag of the existing DRAFT release to rebuild (e.g. v0.3.0)"
        required: false
        type: string

permissions: {}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  release-pr:
    name: release-plz PR
    if: >-
      github.event_name == 'push' &&
      github.repository == 'AndrewKorchemniy/pr-monitor' &&
      vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read               # all writes use the GitHub App token (so CI runs on the release PR)
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # linux-deps: insurance in case release-plz compiles the crate [UNVERIFIED]
      - uses: ./.github/actions/linux-deps    # zizmor: ignore[self-repository] actionlint 1.7.12 rejects `$/`
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    name: release-plz release
    if: github.repository == 'AndrewKorchemniy/pr-monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write              # push tag + create draft release (release-plz, release-current)
      pull-requests: read          # detect the merged release PR
    concurrency:                   # serialize dispatches (no duplicate drafts); push runs get a unique group so none is ever cancelled
      group: release-meta-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.run_id }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - id: rp
        if: github.event_name == 'push'
        uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASES: ${{ steps.rp.outputs.releases }}
          SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          # The release (drafts included; a draft has no git tag yet) named $1 as JSON, or nothing.
          release_json() {
            gh api --paginate "repos/$REPO/releases?per_page=100" | jq -cs --arg t "$1" '[.[][] | select(.tag_name == $t)][0] // empty'
          }
          tag_exists() { gh api "repos/$REPO/git/ref/tags/$1" --silent 2>/dev/null || git rev-parse -q --verify "refs/tags/$1" >/dev/null; }
          dry_run=false; notes=""
          if [ "$EVENT" = push ]; then
            tag=$(jq -r '[.[] | select(.package_name == "pr-monitor") | .tag][0] // empty' <<<"${RELEASES:-[]}")
            version="${tag#v}"; ref="$SHA"
          else
            version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "pr-monitor") | .version')
            case "$MODE" in
              dry-run)
                dry_run=true; tag=""; ref="$SHA"
                ;;
              release-current)
                [ "$GIT_REF" = refs/heads/main ] || { echo "::error::release-current runs only on main (got $GIT_REF)"; exit 1; }
                tag="v$version"; ref="$SHA"
                [[ "$tag" =~ $semver ]] || { echo "::error::bad version '$version' in crates/pr-monitor/Cargo.toml"; exit 1; }
                existing=$(release_json "$tag")
                if [ -n "$existing" ] || tag_exists "$tag"; then
                  echo "::error::release or tag $tag already exists; bump the version in crates/pr-monitor/Cargo.toml (or use mode recover for an unpublished draft)"
                  exit 1
                fi
                # why: one heading per merged pull request with its description and squashed
                # commits, rather than GitHub's generated list of titles alone.
                notes="$(bash .github/scripts/release-notes.sh "$REPO" "$SHA" "$tag")"$'\n\n'"$(bash .github/scripts/release-footer.sh "$REPO")"
                gh release create "$tag" -R "$REPO" --draft --target "$SHA" \
                  --title "PR Monitor $tag" --notes "$notes"
                ;;
              recover)
                [[ "$INPUT_TAG" =~ $semver ]] || { echo "::error::bad tag '$INPUT_TAG'"; exit 1; }
                tag="$INPUT_TAG"; version="${tag#v}"
                rel=$(release_json "$tag")
                draft=missing; [ -z "$rel" ] || draft=$(jq -r '.draft' <<<"$rel")
                [ "$draft" = true ] || { echo "::error::$tag is not an unpublished draft release (draft=$draft); published releases are immutable, bump the version instead"; exit 1; }
                if tag_exists "$tag"; then
                  ref="refs/tags/$tag"                          # release-plz pushes the tag with its draft
                else
                  ref=$(jq -r '.target_commitish' <<<"$rel")    # release-current draft: tag appears on publish
                fi
                ;;
              *)
                echo "::error::unknown mode '$MODE'"; exit 1
                ;;
            esac
          fi
          { echo "tag=$tag"; echo "version=$version"; echo "ref=$ref"; echo "dry_run=$dry_run"; } >> "$GITHUB_OUTPUT"
          echo "mode: ${MODE:-$EVENT} · release tag: '${tag:-<none>}' · version: '${version:-<none>}' · ref: '$ref'" >> "$GITHUB_STEP_SUMMARY"
          # The release's own notes (without the footer) go into the Velopack packages.
          if [ "$dry_run" = true ]; then
            notes=$(bash .github/scripts/release-notes.sh "$REPO" "$SHA" "v$version")
          elif [ -n "$tag" ]; then
            [ -n "$notes" ] || notes=$(release_json "$tag" | jq -r '.body // ""' | tr -d '\r')
            # why: release-plz writes only the changelog; add the footer release-current already has.
            if ! grep -q '^<!-- release-footer -->$' <<<"$notes"; then
              notes="$notes"$'\n\n'"$(bash .github/scripts/release-footer.sh "$REPO")"
              gh release edit "$tag" -R "$REPO" --notes "$notes"
            fi
          fi
          if [ -n "$notes" ]; then
            mkdir -p notes
            awk '/^<!-- release-footer -->$/ { exit } { print }' <<<"$notes" > notes/release-notes.md
          fi
      - if: steps.meta.outputs.tag != '' || steps.meta.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error

  notices:
    name: notices + SBOM
    needs: release
    if: needs.release.outputs.tag != '' || needs.release.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # exact pins; Dependabot does not bump these (keep cargo-about in step with audit.yml)
          tool: cargo-about@0.9.2,cargo-cyclonedx@0.5.9
      - run: |
          set -euo pipefail
          mkdir -p notices
          cargo about generate --locked --fail -m crates/pr-monitor/Cargo.toml -c about.toml -o notices/THIRD-PARTY-LICENSES.html about.hbs
          cargo about generate --locked --fail -m crates/pr-monitor/Cargo.toml -c about.toml -o notices/THIRD-PARTY-LICENSES.txt about-text.hbs
          for entry in windows-x64:x86_64-pc-windows-msvc windows-arm64:aarch64-pc-windows-msvc \
                       linux-x64:x86_64-unknown-linux-gnu linux-arm64:aarch64-unknown-linux-gnu; do
            name=${entry%%:*}; triple=${entry#*:}
            cargo cyclonedx --manifest-path crates/pr-monitor/Cargo.toml --format json --spec-version 1.5 \
              --target "$triple" --override-filename "pr-monitor-$name.cdx"
            mv "crates/pr-monitor/pr-monitor-$name.cdx.json" notices/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: notices/
          if-no-files-found: error

  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [release, notices]
    if: needs.release.outputs.tag != '' || needs.release.outputs.dry_run == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: windows, arch: x64, target: x86_64-pc-windows-msvc, os: windows-latest }
          - { platform: windows, arch: arm64, target: aarch64-pc-windows-msvc, os: windows-11-arm }
          # why: the oldest runner images, so the glibc floor (2.35) is as low as possible on both architectures
          - { platform: linux, arch: x64, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { platform: linux, arch: arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false                 # zizmor cache-poisoning: never restore caches in release builds
          target: ${{ matrix.target }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-auditable@0.7.7  # exact pin, not bumped by Dependabot; prebuilt exists for aarch64_windows (verified)
      - uses: ./.github/actions/arm64-clang    # zizmor: ignore[self-repository] actionlint 1.7.12 rejects `$/`
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps       # zizmor: ignore[self-repository] actionlint 1.7.12 rejects `$/`
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Build (auditable)
        env:
          PRM_THIRD_PARTY_LICENSES: ${{ github.workspace }}/notices/THIRD-PARTY-LICENSES.txt
        run: |
          PRM_BUILD_SHA="$(git rev-parse HEAD)"
          export PRM_BUILD_SHA
          cargo auditable build --release --locked -p pr-monitor --target "$TARGET"
      - name: Verify (PE, size, static CRT, ProductVersion, self-test)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./.github/scripts/verify-exe.ps1 -Exe "target/$env:TARGET/release/pr-monitor.exe" -Arch $env:ARCH -ExpectedVersion $env:VERSION
      - name: Verify (ELF, size, version, self-test)
        if: matrix.platform == 'linux'
        run: ./.github/scripts/verify-elf.sh "target/$TARGET/release/pr-monitor" "$ARCH" "$VERSION"
      - name: Stage
        run: |
          mkdir -p out/exe out/pdb out/icon
          if [ "$PLATFORM" = windows ]; then
            cp "target/$TARGET/release/pr-monitor.exe" "out/exe/pr-monitor-windows-$ARCH.exe"
            cp "target/$TARGET/release/pr_monitor.pdb" "out/pdb/pr-monitor-$VERSION-windows-$ARCH.pdb"
            icon=app.ico
          else
            cp "target/$TARGET/release/pr-monitor" "out/exe/pr-monitor-linux-$ARCH"
            icon=icon-256.png
          fi
          # build.rs generates the icon; the package job has no cargo, so ship it as an artifact.
          icons=(target/"$TARGET"/release/build/pr-monitor-*/out/"$icon")
          [ "${#icons[@]}" -eq 1 ] || { echo "::error::expected one $icon, found ${#icons[@]}"; exit 1; }
          cp "${icons[0]}" "out/icon/$icon"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/exe/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'windows'      # Linux has no PDBs
        with:
          name: pdb-${{ matrix.arch }}
          path: out/pdb/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/icon/
          if-no-files-found: error

  package:                                    # Velopack Setup.exe + Portable.zip (Windows), AppImage (Linux) and update packages
    name: package (${{ matrix.rid }})
    needs: [release, build]
    if: >-
      !cancelled() && needs.build.result == 'success'
    strategy:
      fail-fast: true
      matrix:
        include:
          # Windows: vpk cross-packs both rids on one runner; the exes were already self-tested natively in build.
          - { rid: win-x64, platform: windows, arch: x64, os: windows-latest }
          - { rid: win-arm64, platform: windows, arch: arm64, os: windows-latest }
          # Linux: packed on a runner of the target architecture so the AppImage can be run (smoke test) there.
          - { rid: linux-x64, platform: linux, arch: x64, os: ubuntu-22.04 }
          - { rid: linux-arm64, platform: linux, arch: arm64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RID: ${{ matrix.rid }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exe-${{ matrix.platform }}-${{ matrix.arch }}
          path: exe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: icon-${{ matrix.platform }}-${{ matrix.arch }}
          path: icon
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Pack (vpk) and verify the package
        shell: pwsh
        run: |
          $ext = if ($env:PLATFORM -eq 'windows') { '.exe' } else { '' }
          $icon = if ($env:PLATFORM -eq 'windows') { 'icon/app.ico' } else { 'icon/icon-256.png' }
          ./.github/scripts/pack-velopack.ps1 -Rid $env:RID -Version $env:VERSION `
            -Exe "exe/pr-monitor-$env:PLATFORM-$env:ARCH$ext" -Icon $icon `
            -NoticesDir notices -NotesFile notes/release-notes.md -OutDir velopack-out
      - name: Smoke test the AppImage (--self-test)
        if: matrix.platform == 'linux'
        run: ./.github/scripts/smoke-appimage.sh "velopack-out/AndrewKorchemniy.PRMonitor-$RID.AppImage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velopack-${{ matrix.rid }}
          path: velopack-out/
          if-no-files-found: error

  publish:
    name: publish
    needs: [release, notices, build, package]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:                   # job-level only: workflow-level could cancel a pending release-plz run
      group: publish-${{ needs.release.outputs.tag || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write              # upload assets to the draft
      id-token: write              # Sigstore OIDC for attestations
      attestations: write          # persist attestations
      artifact-metadata: write     # actions/attest v4 storage records
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: velopack-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pdb-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f THIRD-PARTY-LICENSES.txt          # embedded in the exe
          sha256sum -- *.exe *.zip *.AppImage *.nupkg releases.*.json *.pdb *.cdx.json THIRD-PARTY-LICENSES.html > SHA256SUMS.txt
          ls -la
      - name: Upload dist (dry-run)
        if: needs.release.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Attest provenance
        if: needs.release.outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.nupkg
            dist/releases.*.json
            dist/*.pdb
      # why: users download either the installer, the zip or the AppImage, so the SBOM is attached to each.
      - name: Attest SBOM (Windows x64)
        if: needs.release.outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/AndrewKorchemniy.PRMonitor-win-x64-Setup.exe
            dist/AndrewKorchemniy.PRMonitor-win-x64-Portable.zip
          sbom-path: dist/pr-monitor-windows-x64.cdx.json
      - name: Attest SBOM (Windows arm64)
        if: needs.release.outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/AndrewKorchemniy.PRMonitor-win-arm64-Setup.exe
            dist/AndrewKorchemniy.PRMonitor-win-arm64-Portable.zip
          sbom-path: dist/pr-monitor-windows-arm64.cdx.json
      - name: Attest SBOM (Linux x64)
        if: needs.release.outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/AndrewKorchemniy.PRMonitor-linux-x64.AppImage
          sbom-path: dist/pr-monitor-linux-x64.cdx.json
      - name: Attest SBOM (Linux arm64)
        if: needs.release.outputs.dry_run != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/AndrewKorchemniy.PRMonitor-linux-arm64.AppImage
          sbom-path: dist/pr-monitor-linux-arm64.cdx.json
      # why: the draft stays invisible to the app's update check until go-live publishes it; `vpk upload`
      # is not used because it refuses a draft that already holds the feed, which would break `recover`.
      - name: Upload to draft
        if: needs.release.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          # why: a re-run (recover) must not leave assets from an earlier attempt that this run did not make
          for name in $(gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name'); do
            [ -e "dist/$name" ] || gh release delete-asset "$TAG" "$name" -R "$REPO" --yes
          done
          gh release upload "$TAG" -R "$REPO" --clobber \
            dist/*.exe dist/*.zip dist/*.AppImage dist/*.nupkg dist/releases.*.json dist/*.pdb dist/*.cdx.json \
            dist/THIRD-PARTY-LICENSES.html dist/SHA256SUMS.txt

  go-live:                         # human gate: the `release` environment requires a reviewer
    name: go-live
    needs: [release, publish]
    # why: explicit result checks; the implicit success() also fails when any upstream job was skipped
    if: >-
      !cancelled() && needs.publish.result == 'success' &&
      needs.release.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    concurrency:
      group: publish-${{ needs.release.outputs.tag || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write              # publish the draft (this creates the tag for release-current drafts)
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Publish the draft
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then gh release edit "$TAG" -R "$REPO" --draft=false --prerelease
          else gh release edit "$TAG" -R "$REPO" --draft=false --latest; fi
          echo "published $TAG" >> "$GITHUB_STEP_SUMMARY"

  winget:
    name: winget
    needs: [release, go-live]
    if: >-
      !cancelled() && needs.go-live.result == 'success' &&
      vars.WINGET_ENABLED == 'true' && needs.release.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions: {}
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2 (== main HEAD on 2026-10-19)
        with:
          identifier: AndrewKorchemniy.PRMonitor
          release-tag: ${{ needs.release.outputs.tag }}
          installers-regex: '^AndrewKorchemniy\.PRMonitor-win-(x64|arm64)-Setup\.exe$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}   # classic PAT: public_repo + workflow
